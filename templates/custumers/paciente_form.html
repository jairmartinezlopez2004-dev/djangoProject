{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Paciente • Django</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/instagram-style.css' %}">
</head>
<body>
    {% include 'base.html' %}
    
    <div class="container" style="margin-top: 80px;">
        <div class="auth-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Nuevo Paciente</h2>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" name="nombre_completo" class="form-input" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <input type="text" name="telefono" class="form-input" placeholder="Teléfono">
                </div>
                <div class="form-group">
                    <textarea name="direccion" class="form-input" placeholder="Dirección" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Crear Paciente</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'paciente_list' %}" class="link">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
