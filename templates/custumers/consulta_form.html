{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Consulta • Django</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/instagram-style.css' %}">
</head>
<body>
    {% include 'base.html' %}
    
    <div class="container" style="margin-top: 80px;">
        <div class="auth-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Nueva Consulta</h2>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Paciente:</label>
                    <select name="paciente" class="form-input" required>
                        <option value="">Seleccione un paciente</option>
                        {% for paciente in pacientes %}
                        <option value="{{ paciente.pk }}">{{ paciente.nombre_completo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Diagnóstico:</label>
                    <textarea name="diagnostico" class="form-input" placeholder="Diagnóstico" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Tratamiento:</label>
                    <textarea name="tratamiento" class="form-input" placeholder="Tratamiento" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Receta:</label>
                    <textarea name="receta" class="form-input" placeholder="Receta (opcional)" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Observaciones:</label>
                    <textarea name="observaciones" class="form-input" placeholder="Observaciones (opcional)" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Crear Consulta</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'consulta_list' %}" class="link">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
