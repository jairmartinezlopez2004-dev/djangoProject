{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Cita • Django</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/instagram-style.css' %}">
</head>
<body>
    {% include 'base.html' %}
    
    <div class="container" style="margin-top: 80px;">
        <div class="auth-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Eliminar Cita</h2>
            
            <div style="background: #ffebee; padding: 20px; border-radius: 5px; margin-bottom: 20px;">
                <p style="color: #c62828;">¿Estás seguro de que deseas eliminar esta cita?</p>
                <p><strong>Paciente:</strong> {{ cita.paciente.nombre_completo }}</p>
                <p><strong>Fecha:</strong> {{ cita.fecha|date:"Y-m-d H:i" }}</p>
                <p><strong>Motivo:</strong> {{ cita.motivo }}</p>
            </div>
            
            <form method="post" style="text-align: center;">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary" style="background: #c62828;">Confirmar Eliminación</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'cita_list' %}" class="link">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
