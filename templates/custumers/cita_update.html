{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita • Django</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/instagram-style.css' %}">
</head>
<body>
    {% include 'base.html' %}
    
    <div class="container" style="margin-top: 80px;">
        <div class="auth-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Editar Cita</h2>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Estado:</label>
                    <select name="estado" class="form-input">
                        <option value="programada" {% if cita.estado == 'programada' %}selected{% endif %}>Programada</option>
                        <option value="confirmada" {% if cita.estado == 'confirmada' %}selected{% endif %}>Confirmada</option>
                        <option value="completada" {% if cita.estado == 'completada' %}selected{% endif %}>Completada</option>
                        <option value="cancelada" {% if cita.estado == 'cancelada' %}selected{% endif %}>Cancelada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; color: #8e8e8e;">Notas:</label>
                    <textarea name="notas" class="form-input" placeholder="Notas adicionales" rows="3">{{ cita.notas }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary">Actualizar Cita</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'cita_list' %}" class="link">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
