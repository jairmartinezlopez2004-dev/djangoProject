{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña restablecida • Django</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/instagram-style.css' %}">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <div style="text-align: center; margin: 30px 0;">
                <i class="fas fa-check-circle" style="font-size: 48px; color: #00a400; margin-bottom: 20px;"></i>
            </div>
            
            <h2 style="text-align: center; margin-bottom: 20px;">¡Listo!</h2>
            
            <div style="text-align: center; margin-bottom: 30px;">
                <p style="color: #8e8e8e; line-height: 1.5;">
                    Tu contraseña ha sido cambiada exitosamente.
                </p>
                <p style="color: #8e8e8e; line-height: 1.5; margin-top: 10px;">
                    Ya puedes iniciar sesión con tu nueva contraseña.
                </p>
            </div>
            
            <a href="{% url 'login' %}" class="btn btn-primary">Iniciar sesión</a>
        </div>
    </div>
</body>
</html>
